<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signing in to Google…</title>
    <style>body{font-family:"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;color:#444}</style>
  </head>
  <body>
    <p>Redirecting to Google sign-in…</p>
    <script>
      // The Office dialog must open on the add-in's own domain first, then it may
      // navigate to the identity provider. This page builds the Google OAuth URL.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var clientId = params.get("client_id");
        var state = params.get("state");
        if (!clientId || !state) {
          document.body.innerHTML = "<p>Missing client_id or state.</p>";
          return;
        }
        var auth = new URL("https://accounts.google.com/o/oauth2/v2/auth");
        auth.searchParams.set("client_id", clientId);
        auth.searchParams.set("redirect_uri", new URL("callback.html", window.location.href.split("?")[0]).toString());
        auth.searchParams.set("response_type", "token");
        auth.searchParams.set(
          "scope",
          "openid email https://www.googleapis.com/auth/cloud-platform"
        );
        auth.searchParams.set("state", state);
        auth.searchParams.set("include_granted_scopes", "true");
        auth.searchParams.set("prompt", "select_account");
        window.location.replace(auth.toString());
      })();
    </script>
  </body>
</html>
